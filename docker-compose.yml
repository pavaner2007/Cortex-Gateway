
# ─────────────────────────────────────────────────────────────────────────────
# Cortex Gateway – Docker Compose
# Services: postgres, redis, backend (FastAPI), frontend (React/Nginx)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ───────────────────────────────────────────
  # PostgreSQL 16
  # ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cortex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cortex_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cortex_network

  # ───────────────────────────────────────────
  # Redis 7
  # ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cortex_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cortex_network

  # ───────────────────────────────────────────
  # Backend (FastAPI + Uvicorn)
  # ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cortex_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override to use Docker service names instead of localhost
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:-cortex_password}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-cortex_gateway}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cortex_network

  # ───────────────────────────────────────────
  # Frontend (React → Nginx)
  # ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: cortex_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cortex_network

# ─────────────────────────────────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: cortex_postgres_data
  redis_data:
    name: cortex_redis_data
  backend_logs:
    name: cortex_backend_logs

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  cortex_network:
    name: cortex_network
    driver: bridge
