# ─────────────────────────────────────────────────────────────────────────────
# Alembic Configuration – Cortex Gateway
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
# Path to migration scripts directory (relative to this file)
script_location = app/database/migrations

# Add app directory to sys.path so models and config are importable
prepend_sys_path = .

# Version path separator for cross-platform compatibility
version_path_separator = os

# Template for revision files
# file_template = %%(rev)s_%%(slug)s

# The database URL is set dynamically in env.py from app.core.config
# Do NOT set sqlalchemy.url here — it would override the async URL.

# ─────────────────────────────────────────────────────────────────────────────
# Logging Configuration
# ─────────────────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
